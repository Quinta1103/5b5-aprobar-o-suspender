<body>
    <script>
        function aprobadoOsuspenso() {
            let numero=(prompt("Dime tu nota en JS"))
            if (numero>4,9999) {
                alert ("Has aprobado!")
            }
            else {
                alert ("Has suspendido :c")
            }
        }
        
    </script>
    <button onclick="aprobadoOsuspenso()">Insertar Nota del Examen</button>
